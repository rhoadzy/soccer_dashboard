name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  python-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m compileall -q app.py app_context.py router.py app_pages data ui google_sheets_adapter.py loaders.py

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Dependency compatibility check
        run: |
          python -c "import altair, pandas, streamlit; print(f'Streamlit {streamlit.__version__}, pandas {pandas.__version__}, Altair {altair.__version__}')"
